[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-will"
version = "0.1.0"
description = "Offline shadow simulator for bounded proactive agent decisions"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ambientwill = "ambientwill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
